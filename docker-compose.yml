services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: voya
      POSTGRES_PASSWORD: voya
      POSTGRES_DB: voya
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  pgdata:
