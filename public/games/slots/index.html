<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Lucky Slots</title>
<style>
  /* Lucky Slots: three reels, one payline. The server draws the reels and settles the coins; this page only animates. */
  :root {
    --bg: #12051f; --glass: rgba(48,16,72,.78); --hair: rgba(255,255,255,.1); --hair-2: rgba(255,255,255,.18);
    --text: #fff3fb; --muted: #d3a9d9; --faint: #8f6a99; --gold: #ffcf5a; --pink: #ff4fa3; --up: #6ff0b0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; height: 100%; color: var(--text); font: 500 14px/1.35 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums; }
  body { background: radial-gradient(120% 80% at 50% 0%, #3a0f55, var(--bg) 60%); display: flex; flex-direction: column; gap: 10px; padding: 10px 12px; overflow: hidden; }
  body > * { width: 100%; max-width: 520px; margin-inline: auto; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  header { display: flex; align-items: center; gap: 6px; }
  header .spacer { flex: 1; }
  .balance { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px 0 10px; border-radius: 17px; background: var(--glass); border: 1px solid var(--hair); font-weight: 700; }
  .balance svg { width: 16px; height: 16px; color: var(--gold); }
  .ghost { width: 34px; height: 34px; border-radius: 17px; border: 1px solid var(--hair); background: var(--glass); display: grid; place-items: center; color: var(--muted); }

  /* The machine */
  .machine { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 14px; border-radius: 22px;
    background: linear-gradient(180deg, #ff6bb5, #b8237a 45%, #6a1b9a); box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.35); border: 2px solid #ffd36b; }
  .title { text-align: center; font-weight: 900; letter-spacing: .18em; font-size: 15px; color: #fff6d0; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .window { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px; border-radius: 16px; background: #1b0629; box-shadow: inset 0 4px 12px rgba(0,0,0,.6); --cell: min(17vh, 23vw, 92px); }
  .reel { position: relative; height: calc(var(--cell) * 3); overflow: hidden; border-radius: 12px; background: radial-gradient(120% 60% at 50% 50%, #3b1656, #1c0830 75%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .reel::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(10,2,18,.85), transparent 28%, transparent 72%, rgba(10,2,18,.85)); } /* the curved-drum shade */
  .strip { will-change: transform; }
  .cell { height: var(--cell); display: grid; place-items: center; }
  .sym { width: 76%; height: 76%; overflow: visible; filter: drop-shadow(0 5px 6px rgba(0,0,0,.45)); }
  .line { position: absolute; left: 4px; right: 4px; top: 50%; height: calc(var(--cell) + 4px); transform: translateY(-50%); border-radius: 12px; border: 3px solid rgba(255,211,107,.85); pointer-events: none; transition: box-shadow .2s; }
  .window.win .line { animation: winglow .5s ease-in-out 6 alternate; }
  @keyframes winglow { to { box-shadow: 0 0 0 4px rgba(255,211,107,.5), 0 0 26px rgba(255,211,107,.9); } }
  .result { height: 26px; text-align: center; font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .result.big { color: #ffe08a; font-size: 22px; }

  /* Bet + spin */
  .controls { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: stretch; }
  .bet { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 14px; background: var(--glass); border: 1px solid var(--hair); }
  .amt { display: grid; grid-template-columns: 34px 1fr 34px; gap: 4px; height: 32px; }
  .amt button { border: 0; border-radius: 9px; background: rgba(255,255,255,.08); color: var(--muted); font-weight: 900; }
  .amt output { display: grid; place-items: center; border-radius: 9px; background: rgba(0,0,0,.25); font-size: 15px; font-weight: 800; }
  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .quick button { height: 24px; border: 0; border-radius: 7px; background: rgba(255,255,255,.06); color: var(--muted); font-size: 11.5px; font-weight: 700; }
  .quick button[aria-pressed="true"] { background: rgba(255,79,163,.3); color: var(--text); }
  .spin { width: 104px; border: 0; border-radius: 16px; font-size: 18px; font-weight: 900; letter-spacing: .06em; color: #3a1600; background: linear-gradient(180deg, #ffe39a, #ffa630); box-shadow: 0 6px 20px rgba(255,166,48,.45); }
  .spin:active:not(:disabled) { transform: scale(.97); }
  .spin:disabled { color: var(--muted); background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px var(--hair); }

  /* Paytable */
  .panel { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; background: linear-gradient(180deg, #3a0f55, var(--bg) 45%); transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .panel.show { transform: none; }
  .panel-head { display: flex; align-items: center; gap: 10px; }
  .panel-head h2 { flex: 1; margin: 0; font-size: 16px; font-weight: 700; }
  .pays { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
  .pays li { display: flex; align-items: center; justify-content: space-between; padding: 7px 4px; border-bottom: 1px solid var(--hair); font-size: 15px; font-weight: 700; }
  .pays li span { display: flex; align-items: center; gap: 2px; }
  .pays .sym { width: 34px; height: 34px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .pays b { font-size: 15px; color: var(--gold); }
  .note { color: var(--muted); font-size: 12.5px; }
  .toast { position: fixed; z-index: 7; left: 50%; bottom: 120px; transform: translate(-50%, 6px); background: #3a0f55; border: 1px solid var(--hair-2); padding: 9px 14px; border-radius: 12px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .window.win .line { animation: none; box-shadow: 0 0 26px rgba(255,211,107,.9); } }
</style>
</head>

    <button class="ghost" id="closeGame" aria-label="Close game" hidden><svg class="i"><use href="#i-close"/></svg></button>
  </header>

  <div class="machine">
    <div class="title">★ LUCKY SLOTS ★</div>
    <div class="window" id="window">
      <div class="reel"><div class="strip"></div></div>
      <div class="reel"><div class="strip"></div></div>
      <div class="reel"><div class="strip"></div></div>

<script src="/games/socket.io.min.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const num = (n) => Number(n).toLocaleString('en-IN');
const SYMS = ['cherry', 'lemon', 'orange', 'grape', 'bell', 'star', 'seven'];
const icon = (s) => `<svg class="sym" viewBox="0 0 100 100" role="img" aria-label="${s}"><use href="#s-${s}"/></svg>`;
const any = () => SYMS[Math.floor(Math.random() * SYMS.length)];
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }

let game = null, amount = 100, spinning = false;
const reels = [...document.querySelectorAll('.reel')];
const shown = [[any(), any(), any()], [any(), any(), any()], [any(), any(), any()]]; // [above, on the line, below] per reel

function cellH() { return reels[0].clientHeight / 3; }
function draw(reel, syms) { reel.firstElementChild.innerHTML = syms.map((s) => `<div class="cell">${icon(s)}</div>`).join(''); }
reels.forEach((r, i) => draw(r, shown[i]));

// Each reel scrolls a long random strip that ends on [above, result, below]; reels stop one after another.
function animate(result) {
  const h = cellH();
  return Promise.all(reels.map((reel, i) => new Promise((done) => {
    const end = [any(), result[i], any()];
    const strip = [...end, ...Array.from({ length: 14 + i * 5 }, any), ...shown[i]]; // drawn top to bottom; we scroll down to the top
    draw(reel, strip);
    const s = reel.firstElementChild;
    s.style.transition = 'none';
    s.style.transform = `translateY(${-(strip.length - 3) * h}px)`;
    s.getBoundingClientRect(); // apply the start position before animating
    const ms = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 900 + i * 350;
    s.style.transition = `transform ${ms}ms cubic-bezier(.15,.7,.25,1.05)`;
    s.style.transform = 'translateY(0)';
    setTimeout(() => { s.style.transition = 'none'; draw(reel, end); shown[i] = end; done(); }, ms + 20);
  })));
}

// ---------- bet ----------
function setAmount(n) {
  amount = Math.max(1, Math.min(game?.maxBet ?? 100000, n));
  $('amount').textContent = num(amount);
  $('quick').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === amount)));
}
const steps = () => game?.chips ?? [100, 1000, 10000, 100000];
$('minus').onclick = () => { const lower = steps().filter((c) => c < amount); setAmount(lower.length ? lower.at(-1) : amount); };
$('plus').onclick = () => { const higher = steps().find((c) => c > amount); setAmount(higher ?? amount); };

async function spin() {
  if (spinning || !game) return;
  spinning = true; $('spin').disabled = true;
  $('window').classList.remove('win'); $('result').textContent = ''; $('result').className = 'result';
  // Never auto-retried: a spin isn't idempotent.
  const r = await socket.timeout(8000).emitWithAck('slot:spin', { amount }).catch(() => null);
  if (!r?.ok) {
    spinning = false; $('spin').disabled = false;
    return toast(!r ? 'Connection is slow. Check your balance before spinning again' : r.error?.code === 'INSUFFICIENT_COINS' ? 'Not enough coins' : r.error?.message || 'That didn’t work');
  }
  $('balance').textContent = num(r.data.balance - r.data.payout); // the bet leaves now; the win lands when the reels stop
  await animate(r.data.reels);
  $('balance').textContent = num(r.data.balance);
  if (r.data.payout) {
    $('window').classList.add('win');
    $('result').textContent = `WIN ${num(r.data.payout)} · ×${r.data.multiplier}`;
    if (r.data.multiplier >= 20) $('result').classList.add('big');
  } else $('result').textContent = 'No win, try again';
  spinning = false; $('spin').disabled = false;
}
$('spin').onclick = spin;

// ---------- paytable ----------
function fillPays() {
  $('pays').innerHTML = [...SYMS].reverse().map((s) => `<li><span>${icon(s).repeat(3)}</span><b>×${game.pays[s]}</b></li>`).join('')
    + `<li><span>${icon('cherry').repeat(2)}&nbsp;+ any</span><b>×${game.twoCherries}</b></li>`;
  $('payNote').textContent = `Pays on the middle line. Win = bet × multiplier. Over many spins the machine pays back ${(game.rtp * 100).toFixed(2)}% of what is bet.`;
}
$('openPays').onclick = () => $('paysPanel').classList.add('show');
$('closePays').onclick = () => $('paysPanel').classList.remove('show');

// ---------- host app ----------
const pendingToken = [];
window.voyaToken = (t) => pendingToken.splice(0).forEach((r) => r(t));
function getToken() {
  if (!window.ReactNativeWebView) return Promise.resolve(new URLSearchParams(location.hash.slice(1)).get('token') || '');
  return new Promise((r) => { pendingToken.push(r); window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'token' })); });
}
if (window.ReactNativeWebView) {
  $('closeGame').hidden = false; $('closeGame').onclick = () => window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'close' }));
  $('minimizeGame').hidden = false; $('minimizeGame').onclick = () => window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'minimize' }));
}
window.voyaVisibility = () => {}; // no sound to pause

// ---------- socket ----------
const socket = io({ path: '/socket.io/', transports: ['websocket'], auth: (cb) => getToken().then((token) => cb({ token })) });
socket.on('connect', async () => {
  const r = await socket.timeout(8000).emitWithAck('slot:join', {}).catch(() => null);
  if (!r?.ok) return toast('Could not open Lucky Slots');
  game = r.data;
  $('balance').textContent = num(game.balance);
  $('quick').innerHTML = game.chips.map((c) => `<button data-v="${c}">${c >= 1000 ? c / 1000 + 'K' : c}</button>`).join('');
  $('quick').querySelectorAll('button').forEach((b) => (b.onclick = () => setAmount(Number(b.dataset.v))));
  setAmount(amount); fillPays();
  if (!spinning) $('spin').disabled = false;
});
socket.on('connect_error', () => { if (!game) toast("Can't reach the game. Retrying…"); });
</script>
</body>
