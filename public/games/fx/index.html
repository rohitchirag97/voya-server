<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>FX</title>
<style>
  /* Full-screen, transparent SVGA player over the room (app: room/FxLayer.tsx). The app calls window.voyaFx(url) with an
     .svga under /games/fx; it plays once (loops = 1), clears, and says 'done' so the app sends the next one. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #fx { position: absolute; inset: 0; }
  /* An entry banner's name, over the middle of its bubble (placed in script; the file's own text slot is too small). */
  #name {
    position: absolute; display: none; align-items: center; justify-content: center;
    color: #fff; font-family: Arial, sans-serif; font-weight: 700; white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
  }
</style>
<!-- SVGAPlayer-Web 2.3.2 (Apache-2.0). SVGA 2.x files only: export effects as 2.x (1.x zip files aren't loaded). -->
<script src="lib/svga.min.js"></script>
</head>
<body>
<div id="fx"></div>
<div id="name"></div>
<script>
  const tell = (msg) => window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify(msg));
  const player = new SVGA.Player('#fx');
  const parser = new SVGA.Parser('#fx');
  player.loops = 1;
  player.clearsAfterStop = true;
  player.setContentMode('AspectFit');
  const box = document.getElementById('fx');
  const nameTag = document.getElementById('name');
  // Entry banners sit over the room chat (lower half), so Ludo or video mode at the top never hides them.
  const BANNER_TOP = 0.62; // the band's top edge, as a share of the screen height
  const BANNER_MS = 3000; // entry banners show for 3 s (the files run ~5 s), then fade out quickly
  // Each effect says 'done' exactly once: at its natural end, or when a banner is cut short.
  let current = 0;
  let cut = null;
  const finish = (id) => {
    if (id !== current) return;
    current = 0;
    clearTimeout(cut);
    nameTag.style.display = 'none';
    tell({ type: 'done' });
  };
  player.onFinished(() => finish(current));
  const CLEAR = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
  // The picture, cut to a circle (the banner's slot is round). Same origin as this page, so the canvas stays readable.
  const roundPicture = (url) => new Promise((done) => {
    if (!url) return done(null);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = c.height = 120;
      const g = c.getContext('2d');
      g.beginPath(); g.arc(60, 60, 60, 0, Math.PI * 2); g.clip();
      g.drawImage(img, 0, 0, 120, 120);
      try { done(c.toDataURL('image/png')); } catch (e) { done(null); }
    };
    img.onerror = () => done(null);
    img.src = url;
  });

  // Largest font size (up to `max`) at which `text` fits `width` banner pixels.
  const measure = document.createElement('canvas').getContext('2d');
  const fitSize = (text, max, width) => {
    measure.font = `700 ${max}px Arial`; // bold, like the name
    return Math.max(14, Math.min(max, Math.floor((max * width) / Math.max(1, measure.measureText(text).width))));
  };

  const cache = {}; // url -> parsed animation, so a gift sent again starts at once
  // banner (SVIP entries, 750×200): a band across the room chat instead of the whole screen. The person's picture
  // fills slot 03; the file's text slots (01, 02, 04) and grey placeholder bars stay blank, and the name is laid over
  // the middle of the bubble instead (between the picture and the crest: banner x 122–400, y 86–130; the bubble,
  // picture and slots don't move, only the sparkles and crest animate).
  const NAME_BOX = { x: 122, y: 86, w: 278, h: 44 };
  let seq = 0;
  window.voyaFx = async (url, banner) => {
    const id = (current = ++seq);
    player.clearDynamicObjects();
    box.style.cssText = banner ? `top: ${BANNER_TOP * 100}%; bottom: auto; height: calc(100vw * 200 / 750);` : '';
    nameTag.style.display = 'none';
    if (banner) {
      const pic = await roundPicture(banner.avatar);
      if (pic) player.setImage(pic, '03');
      const u = window.innerWidth / 750; // screen px per banner px
      nameTag.textContent = banner.name;
      nameTag.style.cssText = `left: ${NAME_BOX.x * u}px; top: ${window.innerHeight * BANNER_TOP + NAME_BOX.y * u}px;
        width: ${NAME_BOX.w * u}px; height: ${NAME_BOX.h * u}px; font-size: ${fitSize(banner.name, 30, NAME_BOX.w - 8) * u}px;`;
      player.setImage(CLEAR, 'img_11871');
      player.setImage(CLEAR, 'img_11872');
    }
    const play = (item) => {
      player.setVideoItem(item);
      player.startAnimation();
      if (!banner) return;
      nameTag.style.display = 'flex';
      cut = setTimeout(() => {
        for (const el of [box, nameTag]) {
          el.style.transition = 'opacity 0.3s';
          el.style.opacity = '0';
        }
        setTimeout(() => { player.stopAnimation(true); finish(id); }, 300);
      }, BANNER_MS);
    };
    if (cache[url]) return play(cache[url]);
    parser.load(url, (item) => { cache[url] = item; play(item); }, () => finish(id));
  };
  tell({ type: 'ready' });
  // ?play=<path>: preview one effect in a browser (e.g. /games/fx/?play=gift/rocket.svga).
  const preview = new URLSearchParams(location.search).get('play');
  if (preview) window.voyaFx(preview);
</script>
</body>
</html>
