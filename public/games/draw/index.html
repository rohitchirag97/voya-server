<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Draw &amp; Guess</title>
<style>
  /* Draw & Guess canvas for a room in Draw mode, shown inline under the seat row. The drawer draws; everyone else
     watches and types guesses in the room chat. The server relays strokes and judges guesses. */
  :root { --ink:#1d1b2e; --muted:#77748c; --accent:#7b5cff; --panel:rgba(20,16,40,.92); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: transparent; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
  #app { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; background: #2a2150; box-shadow: 0 6px 24px rgba(0,0,0,.35); color: #fff; }
  #hud { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
  #word { flex: 1; min-width: 0; font-weight: 900; font-size: 15px; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #word small { display: block; font-size: 10px; font-weight: 700; letter-spacing: 0; color: #c9c2ff; }
  #timer { flex: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px;
    background: conic-gradient(#ffd25e calc(var(--p, 0) * 1turn), rgba(255,255,255,.14) 0); }
  #timer span { width: 28px; height: 28px; border-radius: 50%; background: #2a2150; display: flex; align-items: center; justify-content: center; }
  #timer[hidden] { display: none; }
  #leave { border: 0; background: none; color: #c9c2ff; font-size: 10px; font-weight: 800; text-decoration: underline; padding: 0; }
  #leave[hidden] { display: none; }
  #scores { flex: none; display: flex; gap: 6px; padding: 0 10px 6px; overflow-x: auto; scrollbar-width: none; }
  .sc { flex: none; display: flex; align-items: center; gap: 5px; padding: 3px 8px 3px 3px; border-radius: 99px; background: rgba(255,255,255,.1); font-size: 11px; font-weight: 800; }
  .sc.drawing { background: #ffd25e; color: #2a2150; }
  .sc.got { box-shadow: inset 0 0 0 2px #3ee08f; }
  .av { flex: none; width: 22px; height: 22px; border-radius: 50%; background: #4a3f80 center/cover no-repeat; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; }
  #stage { position: relative; flex: 1; min-height: 0; margin: 0 8px; border-radius: 12px; overflow: hidden; background: #fff; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #tools { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 8px; }
  #tools[hidden] { display: none; }
  .sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); padding: 0; flex: none; }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .tb { flex: none; border: 0; border-radius: 99px; padding: 5px 10px; font-size: 11px; font-weight: 800; background: rgba(255,255,255,.14); color: #fff; }
  .tb.on { background: var(--accent); }
  .grow { flex: 1; }
  #panel { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(10,8,24,.5); backdrop-filter: blur(1.5px); }
  #panel[hidden] { display: none; }
  .card { width: min(88%, 330px); max-height: 92%; overflow: auto; background: var(--panel); border: 1px solid rgba(255,255,255,.08); border-radius: 18px; padding: 16px 14px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .card h2 { margin: 0; font-size: 18px; }
  .card p { margin: 6px 0 0; font-size: 12px; color: #c9c2ff; }
  .slots { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0 4px; }
  .slot { position: relative; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; }
  .slot .av { width: 40px; height: 40px; font-size: 14px; }
  .slot span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kick { position: absolute; top: -4px; right: 6px; width: 18px; height: 18px; border-radius: 50%; border: 0; background: #e0362b; color: #fff; font-size: 10px; font-weight: 900; padding: 0; }
  .rank { margin: 10px 0 0; padding: 0; list-style: none; text-align: left; font-size: 13px; font-weight: 800; }
  .rank li { display: flex; justify-content: space-between; padding: 5px 4px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .btn { border: 0; border-radius: 99px; padding: 9px 18px; font-size: 13px; font-weight: 800; background: linear-gradient(#9a7dff, #6440f0); color: #fff; }
  .btn.ghost { background: rgba(255,255,255,.12); }
  .btn[disabled] { opacity: .4; }
  #toast { position: absolute; left: 50%; top: 50px; transform: translateX(-50%) translateY(-8px); opacity: 0; visibility: hidden; z-index: 20; background: rgba(0,0,0,.82); color: #fff; padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 800; transition: transform .25s, opacity .25s, visibility .25s; max-width: 90%; text-align: center; }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }
</style>
</head>
<body>
<div id="app">
  <div id="hud"><div id="word" aria-live="polite"></div><button id="leave" hidden>Leave</button><div id="timer" hidden><span id="secs"></span></div></div>
  <div id="scores"></div>
  <div id="stage"><canvas id="c" aria-label="Drawing canvas"></canvas></div>
  <div id="tools" hidden></div>
  <div id="panel"><div class="card" id="card"><h2>🎨 Draw &amp; Guess</h2><p>Connecting…</p></div></div>
  <div id="toast" role="status"></div>
</div>
<script src="/games/socket.io.min.js"></script>
<script>
const ROOM = new URLSearchParams(location.search).get('room');
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const COLORS = ['#1d1b2e', '#e0362b', '#f2731d', '#f4c20d', '#2fb57a', '#1b7fe0', '#7b5cff', '#8a4b2a', '#ffffff'];
const SIZES = [3, 8, 18];

let state = null, me = null, admin = false, offset = 0, turnMs = 80000, word = null;
let pic = []; // this turn's strokes: { id, c, w, pts: [x, y, ...] } in 0..1
let color = COLORS[0], size = SIZES[0];
const now = () => Date.now() + offset;
const drawing = () => state?.phase === 'playing' && state.players[state.drawer]?.userId === me?.userId;
const open = () => state?.startsAt && Date.parse(state.startsAt) <= now();

// ---------- canvas ----------
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function layout() {
  const r = $('stage').getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
  if (r.width < 10) return;
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
// Widths are in 1/400ths of the canvas width, so a stroke looks the same on every phone.
function line(s, from) {
  const p = s.pts;
  ctx.strokeStyle = s.c; ctx.fillStyle = s.c; ctx.lineWidth = (s.w * W) / 400; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (p.length === 2) { ctx.beginPath(); ctx.arc(p[0] * W, p[1] * H, ctx.lineWidth / 2, 0, 7); ctx.fill(); return; }
  ctx.beginPath();
  const i0 = Math.max(0, from - 2);
  ctx.moveTo(p[i0] * W, p[i0 + 1] * H);
  for (let i = i0 + 2; i < p.length; i += 2) ctx.lineTo(p[i] * W, p[i + 1] * H);
  ctx.stroke();
}
function redraw() { ctx.clearRect(0, 0, W, H); pic.forEach((s) => line(s, 0)); }

// ---------- the drawer's pen: points are sent in small batches as the finger moves ----------
let pen = null, outbox = [], flushTimer = null;
const pt = (e) => { const r = cv.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
cv.addEventListener('pointerdown', (e) => {
  if (!drawing() || !open()) return;
  cv.setPointerCapture(e.pointerId);
  pen = { id: Math.random().toString(36).slice(2, 12), c: color, w: size, pts: pt(e) };
  pic.push(pen); line(pen, 0);
  outbox = [...pen.pts]; flush();
});
cv.addEventListener('pointermove', (e) => {
  if (!pen) return;
  const [x, y] = pt(e), n = pen.pts.length;
  if (Math.abs(x - pen.pts[n - 2]) + Math.abs(y - pen.pts[n - 1]) < 0.003) return;
  pen.pts.push(x, y); outbox.push(x, y); line(pen, n);
  if (outbox.length >= 40) flush(); else if (!flushTimer) flushTimer = setTimeout(flush, 60);
});
const up = () => { if (pen) { flush(); pen = null; } };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
function flush() {
  clearTimeout(flushTimer); flushTimer = null;
  if (!pen || !outbox.length) return;
  const pts = outbox.splice(0, 400);
  act('draw:stroke', { id: pen.id, c: pen.c, w: pen.w, pts }, true);
}

function tools() {
  const t = $('tools');
  t.hidden = !drawing();
  if (t.hidden) return;
  t.innerHTML = COLORS.map((c) => `<button class="sw ${c === color ? 'on' : ''}" style="background:${c}" data-c="${c}" aria-label="Colour ${c}"></button>`).join('')
    + '<span class="grow"></span>'
    + SIZES.map((s, i) => `<button class="tb ${s === size ? 'on' : ''}" data-s="${s}" aria-label="Brush ${['thin', 'medium', 'thick'][i]}">${['S', 'M', 'L'][i]}</button>`).join('')
    + '<button class="tb" data-a="undo">Undo</button><button class="tb" data-a="clear">Clear</button>';
  t.querySelectorAll('[data-c]').forEach((b) => (b.onclick = () => { color = b.dataset.c; tools(); }));
  t.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => { size = +b.dataset.s; tools(); }));
  t.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => act(`draw:${b.dataset.a}`)));
}

// ---------- HUD and panels ----------
const avatar = (p) => `<i class="av" style="${p.avatarUrl ? `background-image:url('${esc(p.avatarUrl)}')` : ''}">${p.avatarUrl ? '' : esc((p.displayName || '?').slice(0, 1).toUpperCase())}</i>`;
const nameOf = (p) => (p.userId === me?.userId ? 'You' : esc(p.displayName || 'Someone'));

function render() {
  const s = state, playing = s?.phase === 'playing';
  const drawer = playing ? s.players[s.drawer] : null;
  $('word').innerHTML = !playing ? '' : drawing() ? `${esc(word || '…')}<small>Your turn · draw this word</small>`
    : `${esc(s.hint)}<small>${nameOf(drawer)} is drawing · guess in chat</small>`;
  $('timer').hidden = !playing;
  $('leave').hidden = !(playing && s.players.some((p) => p.userId === me?.userId));
  $('scores').innerHTML = playing || s?.phase === 'finished'
    ? s.players.map((p, i) => `<div class="sc ${playing && i === s.drawer ? 'drawing' : ''} ${s.guessed.includes(p.userId) ? 'got' : ''}">${avatar(p)}${nameOf(p)} · ${p.score}</div>`).join('') : '';
  tools();
  panel();
}

function panel() {
  const s = state, card = $('card');
  const pause = s?.phase === 'playing' && !open() && s.last;
  if (s?.phase === 'playing' && !pause) { $('panel').hidden = true; return; }
  $('panel').hidden = false;
  if (!s) { card.innerHTML = '<h2>Draw &amp; Guess is off</h2><p>The owner or an admin can turn it on.</p>'; return; }
  if (pause) {
    const next = s.players[s.drawer];
    card.innerHTML = `<p>The word was</p><h2>${esc(s.last.word)}</h2><p>${next.userId === me?.userId ? 'Get ready: you draw next!' : `${nameOf(next)} draws next`}</p>`;
    return;
  }
  if (s.phase === 'finished') {
    const ranked = [...s.players].sort((a, b) => b.score - a.score);
    card.innerHTML = `<h2>🏆 ${ranked[0] ? nameOf(ranked[0]) + (ranked[0].userId === me?.userId ? ' won!' : ' wins!') : 'Game over'}</h2>${s.last ? `<p>The last word was <b>${esc(s.last.word)}</b></p>` : ''}
      <ol class="rank">${ranked.map((p, i) => `<li><span>${i + 1}. ${nameOf(p)}</span><span>${p.score}</span></li>`).join('')}</ol>
      <div class="btns"><button class="btn" id="again">Play again</button></div>`;
    $('again').onclick = () => act('draw:join');
    return;
  }
  const joined = s.lobby.some((p) => p.userId === me?.userId);
  const slots = s.lobby.map((p) => {
    const kick = admin && p.userId !== me?.userId ? `<button class="kick" data-kick="${esc(p.userId)}" aria-label="Remove ${esc(p.displayName)}">✕</button>` : '';
    return `<div class="slot">${kick}${avatar(p)}<span>${nameOf(p)}</span></div>`;
  }).join('');
  card.innerHTML = `<h2>🎨 Draw &amp; Guess</h2><p>${s.lobby.length < 2 ? 'Seated players join · 2 to 8 play' : admin ? 'Ready when you are' : 'Waiting for the owner or an admin to start'}</p>
    <div class="slots">${slots}</div>
    <div class="btns">${joined ? '<button class="btn ghost" data-act="leave">Leave</button>' : s.lobby.length < 8 ? '<button class="btn" data-act="join">Join</button>' : ''}${admin ? `<button class="btn" data-act="start" ${s.lobby.length < 2 ? 'disabled' : ''}>Start</button>` : ''}</div>`;
  card.querySelectorAll('[data-act]').forEach((b) => (b.onclick = () => act(`draw:${b.dataset.act}`)));
  card.querySelectorAll('[data-kick]').forEach((b) => (b.onclick = () => confirm('Remove this player from the game?') && act('draw:remove', { userId: b.dataset.kick })));
}

// The clock and the end of the pause, checked a few times a second.
let wasOpen = false;
setInterval(() => {
  const s = state;
  if (s?.phase !== 'playing') return;
  const left = Math.max(0, Date.parse(s.deadline) - now());
  $('timer').style.setProperty('--p', Math.min(1, left / turnMs).toFixed(3));
  $('secs').textContent = Math.ceil(Math.min(left, turnMs) / 1000);
  if (!!open() !== wasOpen) { wasOpen = !!open(); render(); }
}, 250);

let toastTimer;
function toast(t) {
  const el = $('toast');
  el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ---------- state from the server ----------
async function receive(s) {
  const turnChanged = !state || !s || state.turn !== s.turn || state.phase !== s.phase;
  if (state && s && s.v < state.v) return;
  state = s;
  if (turnChanged) { pic = []; pen = null; redraw(); word = null; }
  if (turnChanged && drawing()) {
    const r = await act('draw:word');
    if (r?.ok && state === s) word = r.data.word;
  }
  render();
}

// ---------- actions and connection (same token bridge as the other games) ----------
async function act(event, extra = {}, quiet = false) {
  const r = await socket.timeout(8000).emitWithAck(event, { roomId: ROOM, ...extra }).catch(() => null);
  if (!r) return quiet ? null : toast('No connection. Try again.');
  const FRIENDLY = { CANNOT_TARGET_OWNER: "The room owner can't be removed", CANNOT_TARGET_ADMIN: "Admins can't remove other admins" };
  if (!r.ok && !(quiet && r.error?.code === 'DRAW_NOT_YOUR_TURN')) toast(FRIENDLY[r.error?.code] || r.error?.message || 'That didn’t work');
  return r;
}
$('leave').onclick = () => confirm('Leave this game? Your score is lost.') && act('draw:leave');

const pendingToken = [];
window.voyaToken = (t) => pendingToken.splice(0).forEach((r) => r(t));
function getToken() {
  if (!window.ReactNativeWebView) return Promise.resolve(new URLSearchParams(location.hash.slice(1)).get('token') || '');
  return new Promise((r) => { pendingToken.push(r); window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'token' })); });
}

layout();
new ResizeObserver(() => layout()).observe($('stage'));
const socket = io({ path: '/socket.io/', transports: ['websocket'], auth: (cb) => getToken().then((token) => cb({ token })) });
socket.on('connect', async () => {
  const r = await socket.timeout(8000).emitWithAck('draw:watch', { roomId: ROOM }).catch(() => null);
  if (!r?.ok) return toast('Could not open Draw & Guess');
  me = r.data.me; admin = r.data.me.admin; turnMs = r.data.turnMs ?? turnMs; offset = new Date(r.data.serverNow) - Date.now();
  state = r.data.state; word = r.data.word; pic = r.data.strokes || []; wasOpen = !!open(); // a fresh start after every (re)connect
  redraw(); render();
});
socket.on('connect_error', () => toast("Can't reach the game. Retrying…"));
socket.on('draw:state', (e) => {
  if (e.roomId !== ROOM) return;
  offset = new Date(e.serverNow) - Date.now();
  receive(e.state);
});
socket.on('draw:stroke', (e) => {
  if (e.roomId !== ROOM || e.turn !== state?.turn || drawing()) return; // the drawer already drew it
  let s = pic.find((x) => x.id === e.id);
  const from = s ? s.pts.length : 0;
  if (s) s.pts.push(...e.pts); else pic.push((s = { id: e.id, c: e.c, w: e.w, pts: [...e.pts] }));
  line(s, from);
});
socket.on('draw:picture', (e) => {
  if (e.roomId !== ROOM || e.turn !== state?.turn) return;
  pic = e.strokes; pen = null; redraw();
});
</script>
</body>
</html>
